<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF / PNG Converter</title>
<script src="https://jbenedict.com/assets/js/jquery.js"></script>
<script src="https://jbenedict.com/assets/js/main.js" type="text/javascript" defer></script>
<link rel="stylesheet" media="screen" href="https://jbenedict.com/assets/css/main.css">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>if (typeof pdfjsLib === 'undefined') window.pdfjsLib = window['pdfjs-dist/build/pdf'];</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #a30b00;
    --accent-dim: #8a0900;
    --radius: 6px;
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: 115px;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }

  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 115px - 53px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 20px 120px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: 100%;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .mode-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 10px 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.4;
  }
  .mode-btn:hover { border-color: var(--border2); color: var(--text); }
  .mode-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  .drop-zone {
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(163,11,0,0.04); }
  .drop-zone input { display: none; }
  .drop-zone .icon { font-size: 24px; color: var(--text3); margin-bottom: 8px; display: block; }
  .drop-zone p { color: var(--text2); font-size: 12px; line-height: 1.5; }
  .drop-zone p strong { color: var(--text); font-weight: 400; }

  .size-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .size-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .size-btn:hover { border-color: var(--border2); color: var(--text); }
  .size-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  /* PNG list for PNG->PDF mode */
  .file-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .file-thumb {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .file-name {
    font-size: 11px;
    color: var(--text2);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
  }

  .file-remove {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 16px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .file-remove:hover { color: var(--accent); }

  .add-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    text-align: center;
  }
  .add-btn:hover { border-color: var(--border2); color: var(--text); }

  .info-block { display: flex; flex-direction: column; gap: 6px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text2); }
  .info-val { font-family: var(--font-mono); font-size: 12px; color: var(--text); }

  .export-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    margin-top: 14px;
  }
  .export-btn:hover { background: var(--accent-dim); }
  .export-btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }

  /* Canvas area */
  .canvas-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #1e1e1e 1px, transparent 0);
    background-size: 24px 24px;
    padding: 32px 32px calc(70px + 32px) 32px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    min-height: 0;
    gap: 16px;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text3);
  }
  .placeholder svg { opacity: 0.2; }
  .placeholder p { font-size: 13px; text-align: center; line-height: 1.6; }

  .preview-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .preview-img {
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: block;
    max-width: min(calc(100vw - 280px - 64px), calc((100vh - 115px - 53px - 70px - 130px) * 0.75));
    background: #fff;
  }

  .preview-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
  }

  /* progress */
  .progress-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }
  .progress-label { font-size: 12px; color: var(--text2); font-family: var(--font-mono); }
  .progress-bar { width: 100%; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.1s; width: 0%; }

  .footer { position: fixed; bottom: 0; left: 0; }
</style>
</head>
<body>

<div id="importheader"></div>

<header>
  <h1>PDF / PNG Converter</h1>
  <span>Convert between PDF and PNG formats</span>
</header>

<div class="workspace">
  <div class="sidebar">

    <div>
      <div class="section-label">Mode</div>
      <div class="mode-grid">
        <button class="mode-btn active" data-mode="pdf-to-png">PDF<br>→ PNG</button>
        <button class="mode-btn" data-mode="png-to-pdf">PNG<br>→ PDF</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- PDF to PNG controls -->
    <div id="pdfToPngControls">
      <div>
        <div class="section-label">PDF File</div>
        <div class="drop-zone" id="pdfDropZone">
          <input type="file" id="pdfFileInput" accept=".pdf,application/pdf">
          <span class="icon">⬆</span>
          <p><strong>Drop PDF here</strong><br>or click to browse</p>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-label">Resolution</div>
        <div class="size-grid">
          <button class="size-btn" data-dpi="72">72 DPI<br><span style="font-size:9px;color:var(--text3);">screen</span></button>
          <button class="size-btn active" data-dpi="150">150 DPI<br><span style="font-size:9px;color:var(--text3);">balanced</span></button>
          <button class="size-btn" data-dpi="300">300 DPI<br><span style="font-size:9px;color:var(--text3);">print</span></button>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="section-label">Info</div>
        <div class="info-block">
          <div class="info-row"><span>Pages</span><span class="info-val" id="pdfPages">—</span></div>
          <div class="info-row"><span>File</span><span class="info-val" id="pdfFile">—</span></div>
        </div>
        <button class="export-btn" id="pdfExportBtn" disabled>Download PNGs (.zip)</button>
      </div>
    </div>

    <!-- PNG to PDF controls -->
    <div id="pngToPdfControls" style="display:none;">
      <div>
        <div class="section-label">Images <span id="pngCount" style="color:var(--text3); font-family:var(--font-mono);">0</span></div>
        <div class="file-list" id="fileList"></div>
        <div class="drop-zone" id="pngDropZone" style="margin-top:8px;">
          <input type="file" id="pngFileInput" accept="image/png,image/jpeg,image/webp" multiple>
          <span class="icon" style="font-size:18px;">+</span>
          <p><strong>Add images</strong><br>PNG, JPG, WebP</p>
        </div>
        <button class="export-btn" id="pngExportBtn" disabled>Download PDF</button>
      </div>
    </div>

  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="4" width="28" height="36" rx="3" stroke="#888" stroke-width="1.5"/>
        <path d="M28 4 L38 14" stroke="#888" stroke-width="1.5"/>
        <rect x="28" y="4" width="10" height="10" rx="1" stroke="#888" stroke-width="1.5"/>
        <rect x="30" y="28" width="24" height="30" rx="3" stroke="#a30b00" stroke-width="1.5"/>
        <path d="M42 28 L54 40" stroke="#a30b00" stroke-width="1.5"/>
        <rect x="42" y="28" width="12" height="12" rx="1" stroke="#a30b00" stroke-width="1.5"/>
      </svg>
      <p>Upload a file to convert</p>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <span class="progress-label" id="progressLabel">Processing...</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="preview-wrap" id="previewWrap" style="display:none;"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const PT_PER_INCH = 72;
const state = {
  mode: 'pdf-to-png',
  pdfDoc: null,
  pdfFilename: 'document',
  dpi: 150,
  pngFiles: [], // { name, dataUrl, img }
};

// ── Mode switch ───────────────────────────────────────────────────

function switchMode(mode) {
  state.mode = mode;
  document.getElementById('pdfToPngControls').style.display = mode === 'pdf-to-png' ? 'flex' : 'none';
  document.getElementById('pngToPdfControls').style.display = mode === 'png-to-pdf' ? 'flex' : 'none';
  document.getElementById('pdfToPngControls').style.flexDirection = 'column';
  document.getElementById('pdfToPngControls').style.gap = '20px';
  document.getElementById('previewWrap').style.display = 'none';
  document.getElementById('previewWrap').innerHTML = '';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('progressWrap').style.display = 'none';
}

// ── PDF -> PNG ────────────────────────────────────────────────────

async function loadPDF(arrayBuffer, filename) {
  state.pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  state.pdfFilename = filename.replace(/\.pdf$/i, '');
  document.getElementById('pdfPages').textContent = state.pdfDoc.numPages;
  document.getElementById('pdfFile').textContent = filename.length > 18 ? filename.slice(0,16) + '...' : filename;
  document.getElementById('pdfExportBtn').disabled = false;
  await renderPDFPreview();
}

async function renderPDFPreview() {
  const wrap = document.getElementById('previewWrap');
  wrap.innerHTML = '';
  document.getElementById('placeholder').style.display = 'none';
  wrap.style.display = 'flex';

  const scale = Math.min(state.dpi / PT_PER_INCH, 1);
  const page = await state.pdfDoc.getPage(1);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.className = 'preview-img';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;

  const label = document.createElement('span');
  label.className = 'preview-label';
  const n = state.pdfDoc.numPages;
  label.textContent = n > 1 ? `Page 1 of ${n} - all ${n} pages will be exported` : '1 page';

  wrap.appendChild(label);
  wrap.appendChild(canvas);
}

async function exportPDFtoPNGs() {
  const btn = document.getElementById('pdfExportBtn');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  progressWrap.style.display = 'flex';

  const scale = state.dpi / PT_PER_INCH;
  const numPages = state.pdfDoc.numPages;
  const zip = new JSZip();
  const folder = zip.folder('pages');

  for (let i = 1; i <= numPages; i++) {
    progressLabel.textContent = `Rendering page ${i} of ${numPages}...`;
    progressFill.style.width = ((i-1) / numPages * 100) + '%';

    const page = await state.pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;

    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const num = String(i).padStart(2, '0');
    folder.file(`page-${num}.png`, blob);
    await new Promise(r => setTimeout(r, 0));
  }

  progressFill.style.width = '100%';
  progressLabel.textContent = 'Saving ZIP...';
  await new Promise(r => setTimeout(r, 50));

  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = state.pdfFilename + '-pages.zip';
  a.click();
  URL.revokeObjectURL(url);

  progressWrap.style.display = 'none';
  btn.disabled = false;
  btn.textContent = 'Download PNGs (.zip)';
}

// ── PNG -> PDF ────────────────────────────────────────────────────

function addImages(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        state.pngFiles.push({ name: file.name, dataUrl: e.target.result, img });
        renderFileList();
        renderPNGPreview();
        document.getElementById('pngExportBtn').disabled = false;
        document.getElementById('pngCount').textContent = state.pngFiles.length;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  state.pngFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';

    const thumb = document.createElement('img');
    thumb.className = 'file-thumb';
    thumb.src = f.dataUrl;

    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = f.name;

    const rm = document.createElement('button');
    rm.className = 'file-remove';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      state.pngFiles.splice(i, 1);
      renderFileList();
      renderPNGPreview();
      document.getElementById('pngCount').textContent = state.pngFiles.length;
      if (!state.pngFiles.length) {
        document.getElementById('pngExportBtn').disabled = true;
        document.getElementById('placeholder').style.display = 'flex';
        document.getElementById('previewWrap').style.display = 'none';
      }
    });

    item.appendChild(thumb);
    item.appendChild(name);
    item.appendChild(rm);
    list.appendChild(item);
  });
}

function renderPNGPreview() {
  if (!state.pngFiles.length) return;
  const wrap = document.getElementById('previewWrap');
  wrap.innerHTML = '';
  document.getElementById('placeholder').style.display = 'none';
  wrap.style.display = 'flex';

  const f = state.pngFiles[0];
  const img = document.createElement('img');
  img.className = 'preview-img';
  img.src = f.dataUrl;

  const label = document.createElement('span');
  label.className = 'preview-label';
  const n = state.pngFiles.length;
  label.textContent = n > 1 ? `${f.name} - ${n} images total` : f.name;

  wrap.appendChild(label);
  wrap.appendChild(img);
}

async function exportPNGtoPDF() {
  if (!state.pngFiles.length) return;
  const btn = document.getElementById('pngExportBtn');
  btn.disabled = true;
  btn.textContent = 'Building PDF...';

  const { jsPDF } = window.jspdf;
  let pdf = null;

  // Standard letter width in points: 8.5in portrait, 11in landscape
  const PORTRAIT_W  = 8.5 * 72;  // 612pt
  const LANDSCAPE_W = 11  * 72;  // 792pt

  for (let i = 0; i < state.pngFiles.length; i++) {
    const { img } = state.pngFiles[i];
    const isLandscape = img.naturalWidth > img.naturalHeight;

    // Page width is standard letter width for that orientation
    const pageW = isLandscape ? LANDSCAPE_W : PORTRAIT_W;
    // Page height scales proportionally to the image — not forced to letter height
    const imgAspect = img.naturalHeight / img.naturalWidth;
    const pageH = pageW * imgAspect;
    const orientation = isLandscape ? 'l' : 'p';

    // Re-encode as JPEG
    const offscreen = document.createElement('canvas');
    offscreen.width = img.naturalWidth;
    offscreen.height = img.naturalHeight;
    const octx = offscreen.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, offscreen.width, offscreen.height);
    octx.drawImage(img, 0, 0);
    const jpegData = offscreen.toDataURL('image/jpeg', 0.85);

    if (!pdf) {
      pdf = new jsPDF({ orientation, unit: 'pt', format: [pageW, pageH], compress: true });
    } else {
      pdf.addPage([pageW, pageH], orientation);
    }

    pdf.addImage(jpegData, 'JPEG', 0, 0, pageW, pageH, '', 'FAST');
    await new Promise(r => setTimeout(r, 0));
  }

  pdf.save('converted.pdf');
  btn.disabled = false;
  btn.textContent = 'Download PDF';
}

// ── Universal file handler ────────────────────────────────────────

function handleFile(file) {
  if (!file) return;
  const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  const isImage = file.type.startsWith('image/');

  if (isPDF && state.mode !== 'pdf-to-png') {
    // Auto-switch to PDF mode
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-mode="pdf-to-png"]').classList.add('active');
    switchMode('pdf-to-png');
  } else if (isImage && state.mode !== 'png-to-pdf') {
    // Auto-switch to PNG mode
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-mode="png-to-pdf"]').classList.add('active');
    switchMode('png-to-pdf');
  }

  if (isPDF) {
    const r = new FileReader();
    r.onload = ev => loadPDF(ev.target.result, file.name);
    r.readAsArrayBuffer(file);
  } else if (isImage) {
    addImages([file]);
  }
}

function handleFiles(files) {
  Array.from(files).forEach(handleFile);
}

// ── Init ──────────────────────────────────────────────────────────

function init() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchMode(btn.dataset.mode);
    });
  });

  // PDF drop zone
  const pdfDz = document.getElementById('pdfDropZone');
  pdfDz.addEventListener('click', () => document.getElementById('pdfFileInput').click());
  pdfDz.addEventListener('dragover', e => { e.preventDefault(); pdfDz.classList.add('dragover'); });
  pdfDz.addEventListener('dragleave', () => pdfDz.classList.remove('dragover'));
  pdfDz.addEventListener('drop', e => { e.preventDefault(); pdfDz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
  document.getElementById('pdfFileInput').addEventListener('change', e => handleFiles(e.target.files));

  // DPI buttons
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.dpi = parseInt(btn.dataset.dpi);
      if (state.pdfDoc) renderPDFPreview();
    });
  });

  document.getElementById('pdfExportBtn').addEventListener('click', exportPDFtoPNGs);

  // PNG drop zone
  const pngDz = document.getElementById('pngDropZone');
  pngDz.addEventListener('click', () => document.getElementById('pngFileInput').click());
  pngDz.addEventListener('dragover', e => { e.preventDefault(); pngDz.classList.add('dragover'); });
  pngDz.addEventListener('dragleave', () => pngDz.classList.remove('dragover'));
  pngDz.addEventListener('drop', e => { e.preventDefault(); pngDz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
  document.getElementById('pngFileInput').addEventListener('change', e => handleFiles(e.target.files));

  document.getElementById('pngExportBtn').addEventListener('click', exportPNGtoPDF);

  // Paste anywhere
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) { handleFile(item.getAsFile()); break; }
    }
  });

  // Initial layout fix
  document.getElementById('pdfToPngControls').style.display = 'flex';
  document.getElementById('pdfToPngControls').style.flexDirection = 'column';
  document.getElementById('pdfToPngControls').style.gap = '20px';
}

init();
</script>

<div id="importfooter"></div>
</body>
</html>
