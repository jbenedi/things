<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Generator</title>
<script src="https://jbenedict.com/assets/js/jquery.js"></script>
<script src="https://jbenedict.com/assets/js/main.js" type="text/javascript" defer></script>
<link rel="stylesheet" media="screen" href="https://jbenedict.com/assets/css/main.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #a30b00;
    --accent-dim: #8a0900;
    --radius: 6px;
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: 115px;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }

  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 115px - 53px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 20px 90px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: 100%;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .fit-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 3px;
  }

  .fit-tab {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--text3);
    font-size: 12px;
    font-family: var(--font-sans);
    padding: 5px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .fit-tab.active { background: var(--surface); color: var(--text); }

  .size-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .size-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 7px 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .size-btn:hover { border-color: var(--border2); color: var(--text); }
  .size-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  /* Color stops */
  .stops-list { display: flex; flex-direction: column; gap: 6px; }

  .stop-row { display: flex; align-items: center; gap: 8px; }

  .stop-swatch {
    width: 28px; height: 28px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    cursor: pointer;
    flex-shrink: 0;
    padding: 2px;
    background: transparent;
    -webkit-appearance: none; appearance: none;
  }
  .stop-swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .stop-swatch::-webkit-color-swatch { border: none; border-radius: 2px; }

  .stop-pos {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 6px;
    width: 52px;
    outline: none;
    text-align: center;
    flex-shrink: 0;
  }
  .stop-pos:focus { border-color: var(--border2); }

  .stop-label { font-size: 11px; color: var(--text3); flex: 1; font-family: var(--font-mono); }

  .stop-remove {
    background: none; border: none;
    color: var(--text3);
    font-size: 16px; cursor: pointer;
    padding: 0 2px; line-height: 1;
    transition: color 0.15s; flex-shrink: 0;
  }
  .stop-remove:hover { color: var(--accent); }

  /* Corner stops */
  .corner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .corner-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .corner-item label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); }

  .corner-swatch {
    width: 40px; height: 40px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    cursor: pointer;
    padding: 3px;
    background: transparent;
    -webkit-appearance: none; appearance: none;
  }
  .corner-swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .corner-swatch::-webkit-color-swatch { border: none; border-radius: 3px; }

  .add-stop-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    text-align: center;
  }
  .add-stop-btn:hover { border-color: var(--border2); color: var(--text); }

  .css-output {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px;
    width: 100%;
    line-height: 1.6;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: text;
    user-select: all;
    min-height: 60px;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text3);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--border2); color: var(--text); }
  .copy-btn.copied { border-color: var(--accent); color: var(--accent); }

  .row-between { display: flex; justify-content: space-between; align-items: center; }

  .export-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    margin-top: 14px;
  }
  .export-btn:hover { background: var(--accent-dim); }

  /* Angle dial */
  .angle-wrap { display: flex; align-items: center; gap: 12px; }

  .angle-dial {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--surface2);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .angle-dial::after {
    content: '';
    position: absolute;
    width: 2px; height: 12px;
    background: var(--accent);
    border-radius: 1px;
    top: 4px; left: 50%;
    transform-origin: bottom center;
    transform: translateX(-50%);
  }

  .angle-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 8px;
    width: 64px;
    outline: none;
    text-align: center;
  }
  .angle-input:focus { border-color: var(--border2); }

  /* Canvas area */
  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #1e1e1e 1px, transparent 0);
    background-size: 24px 24px;
    padding: 32px 32px calc(70px + 32px) 32px;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }

  .gradient-preview {
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    transition: background 0.1s, width 0.2s, height 0.2s;
    max-width: calc(100vw - 280px - 64px);
    max-height: calc(100vh - 115px - 53px - 70px - 96px);
  }

  .footer { position: fixed; bottom: 0; left: 0; }
</style>
</head>
<body>

<div id="importheader"></div>

<header>
  <h1>Gradient Generator</h1>
  <span>Create linear, radial, and corner CSS gradients</span>
</header>

<div class="workspace">
  <div class="sidebar">

    <div>
      <div class="section-label">Type</div>
      <div class="fit-tabs">
        <button class="fit-tab active" data-type="linear">Linear</button>
        <button class="fit-tab" data-type="radial">Radial</button>
        <button class="fit-tab" data-type="corners">Corners</button>
      </div>
    </div>

    <div id="angleSection">
      <div class="section-label">Angle</div>
      <div class="angle-wrap">
        <div class="angle-dial" id="angleDial"></div>
        <input type="number" class="angle-input" id="angleInput" value="135" min="0" max="360">
        <span style="font-size:12px; color:var(--text3);">deg</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Linear/Radial stops -->
    <div id="stopsSection">
      <div class="row-between" style="margin-bottom:10px;">
        <div class="section-label" style="margin:0;">Color Stops</div>
      </div>
      <div class="stops-list" id="stopsList"></div>
      <button class="add-stop-btn" id="addStopBtn" style="margin-top:8px;">+ Add Stop</button>
    </div>

    <!-- Corners stops -->
    <div id="cornersSection" style="display:none;">
      <div class="section-label">Corner Colors</div>
      <div class="corner-grid">
        <div class="corner-item">
          <label>Top Left</label>
          <input type="color" class="corner-swatch" id="cornerTL" value="#a30b00">
        </div>
        <div class="corner-item">
          <label>Top Right</label>
          <input type="color" class="corner-swatch" id="cornerTR" value="#ff6b6b">
        </div>
        <div class="corner-item">
          <label>Bottom Left</label>
          <input type="color" class="corner-swatch" id="cornerBL" value="#1a1a2e">
        </div>
        <div class="corner-item">
          <label>Bottom Right</label>
          <input type="color" class="corner-swatch" id="cornerBR" value="#ffd93d">
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Aspect Ratio</div>
      <div class="size-grid">
        <button class="size-btn active" data-ratio="1:1">1:1</button>
        <button class="size-btn" data-ratio="5:4">5:4</button>
        <button class="size-btn" data-ratio="16:9">16:9</button>
      </div>
      <button class="export-btn" id="exportBtn">Download PNG</button>
    </div>

    <div class="divider"></div>

    <div>
      <div class="row-between" style="margin-bottom:8px;">
        <div class="section-label" style="margin:0;">CSS Output</div>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="css-output" id="cssOutput"></div>
    </div>

  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="gradient-preview" id="gradientPreview"></div>
  </div>
</div>

<script>
const state = {
  type: 'linear',
  angle: 135,
  ratio: '1:1',
  stops: [
    { color: '#a30b00', pos: 0 },
    { color: '#ff6b6b', pos: 50 },
    { color: '#ffd93d', pos: 100 },
  ],
  corners: {
    tl: '#a30b00', tr: '#ff6b6b',
    bl: '#1a1a2e', br: '#ffd93d'
  }
};

const BASE_SIZE = 120; // export resolution base — 1:1=1200×1200, 16:9=1920×1080

function getRatioDims() {
  const [rw, rh] = state.ratio.split(':').map(Number);
  return { w: rw, h: rh };
}

function buildCSS() {
  if (state.type === 'linear') {
    const sorted = [...state.stops].sort((a, b) => a.pos - b.pos);
    const stopsStr = sorted.map(s => `${s.color} ${s.pos}%`).join(', ');
    return `linear-gradient(${state.angle}deg, ${stopsStr})`;
  }
  if (state.type === 'radial') {
    const sorted = [...state.stops].sort((a, b) => a.pos - b.pos);
    const stopsStr = sorted.map(s => `${s.color} ${s.pos}%`).join(', ');
    return `radial-gradient(circle, ${stopsStr})`;
  }
  if (state.type === 'corners') {
    const { tl, tr, bl, br } = state.corners;
    // Multi-layered radial gradients anchored to each corner, blended with screen
    return [
      `radial-gradient(ellipse at 0% 0%, ${tl} 0%, transparent 70%)`,
      `radial-gradient(ellipse at 100% 0%, ${tr} 0%, transparent 70%)`,
      `radial-gradient(ellipse at 0% 100%, ${bl} 0%, transparent 70%)`,
      `radial-gradient(ellipse at 100% 100%, ${br} 0%, transparent 70%)`
    ].join(', ');
  }
}

function getPreviewSize() {
  const area = document.getElementById('canvasArea');
  const maxW = area.clientWidth - 64;
  const maxH = area.clientHeight - 64 - 70; // account for footer
  const { w, h } = getRatioDims();
  const scale = Math.min(maxW / w, maxH / h);
  return { pw: Math.round(w * scale), ph: Math.round(h * scale) };
}

function render() {
  const css = buildCSS();
  const preview = document.getElementById('gradientPreview');
  const { pw, ph } = getPreviewSize();
  preview.style.width = pw + 'px';
  preview.style.height = ph + 'px';
  preview.style.background = css;

  const cssText = state.type === 'corners'
    ? `background:\n  ${css.split(', ').join(',\n  ')};`
    : `background: ${css};`;
  document.getElementById('cssOutput').textContent = cssText;

  updateDial();
}

function updateDial() {
  document.getElementById('angleDial').style.transform = `rotate(${state.angle}deg)`;
}

function renderStops() {
  const list = document.getElementById('stopsList');
  list.innerHTML = '';
  state.stops.forEach((stop, i) => {
    const row = document.createElement('div');
    row.className = 'stop-row';

    const swatch = document.createElement('input');
    swatch.type = 'color';
    swatch.className = 'stop-swatch';
    swatch.value = stop.color;
    swatch.addEventListener('input', e => { state.stops[i].color = e.target.value; render(); });

    const pos = document.createElement('input');
    pos.type = 'number';
    pos.className = 'stop-pos';
    pos.min = 0; pos.max = 100;
    pos.value = stop.pos;
    pos.addEventListener('input', e => {
      state.stops[i].pos = Math.min(100, Math.max(0, parseInt(e.target.value) || 0));
      render();
    });

    const pct = document.createElement('span');
    pct.className = 'stop-label';
    pct.textContent = '%';

    const rm = document.createElement('button');
    rm.className = 'stop-remove';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      if (state.stops.length <= 2) return;
      state.stops.splice(i, 1);
      renderStops();
      render();
    });

    row.appendChild(swatch);
    row.appendChild(pos);
    row.appendChild(pct);
    row.appendChild(rm);
    list.appendChild(row);
  });
}

function exportPNG() {
  const { w, h } = getRatioDims();
  const exportW = BASE_SIZE * w;
  const exportH = BASE_SIZE * h;

  const canvas = document.createElement('canvas');
  canvas.width = exportW;
  canvas.height = exportH;
  const ctx = canvas.getContext('2d');

  const hexToRgba = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };

  if (state.type === 'linear') {
    const sorted = [...state.stops].sort((a, b) => a.pos - b.pos);
    const angleRad = (state.angle - 90) * Math.PI / 180;
    const cx = exportW / 2, cy = exportH / 2;
    const len = Math.abs(exportW * Math.sin(angleRad)) + Math.abs(exportH * Math.cos(angleRad));
    const x0 = cx - Math.sin(angleRad) * len / 2;
    const y0 = cy - Math.cos(angleRad) * len / 2;  // fixed: was + for correct direction
    const x1 = cx + Math.sin(angleRad) * len / 2;
    const y1 = cy + Math.cos(angleRad) * len / 2;  // fixed: was - for correct direction
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    sorted.forEach(s => grad.addColorStop(s.pos / 100, s.color));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, exportW, exportH);

  } else if (state.type === 'radial') {
    const sorted = [...state.stops].sort((a, b) => a.pos - b.pos);
    const cx = exportW / 2, cy = exportH / 2;
    const r = Math.min(exportW, exportH) / 2;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    sorted.forEach(s => grad.addColorStop(s.pos / 100, s.color));
    // Fill background with last stop color first
    ctx.fillStyle = sorted[sorted.length - 1].color;
    ctx.fillRect(0, 0, exportW, exportH);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, exportW, exportH);

  } else if (state.type === 'corners') {
    const { tl, tr, bl, br } = state.corners;
    const corners = [
      { color: tl, x: 0,       y: 0 },
      { color: tr, x: exportW, y: 0 },
      { color: bl, x: 0,       y: exportH },
      { color: br, x: exportW, y: exportH },
    ];
    corners.forEach(({ color, x, y }) => {
      const radius = Math.sqrt(exportW ** 2 + exportH ** 2) * 0.85;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, hexToRgba(color, 1));
      grad.addColorStop(1, hexToRgba(color, 0));
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, exportW, exportH);
    });
    ctx.globalCompositeOperation = 'source-over';
  }

  download(canvas);
}

function download(canvas) {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gradient-${state.type}-${state.ratio.replace(':','x')}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function init() {
  document.querySelectorAll('.fit-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fit-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.type = btn.dataset.type;
      document.getElementById('angleSection').style.display = state.type === 'radial' || state.type === 'corners' ? 'none' : 'block';
      document.getElementById('stopsSection').style.display = state.type === 'corners' ? 'none' : 'block';
      document.getElementById('cornersSection').style.display = state.type === 'corners' ? 'block' : 'none';
      render();
    });
  });

  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.ratio = btn.dataset.ratio;
      render();
    });
  });

  document.getElementById('angleInput').addEventListener('input', e => {
    state.angle = ((parseInt(e.target.value) || 0) % 360 + 360) % 360;
    render();
  });

  const dial = document.getElementById('angleDial');
  let draggingDial = false;
  dial.addEventListener('mousedown', e => { draggingDial = true; handleDialMove(e); });
  document.addEventListener('mousemove', e => { if (draggingDial) handleDialMove(e); });
  document.addEventListener('mouseup', () => { draggingDial = false; });

  function handleDialMove(e) {
    const rect = dial.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let angle = Math.round(Math.atan2(e.clientX - cx, -(e.clientY - cy)) * (180 / Math.PI));
    angle = ((angle % 360) + 360) % 360;
    state.angle = angle;
    document.getElementById('angleInput').value = angle;
    render();
  }

  // Corner pickers
  ['TL','TR','BL','BR'].forEach(corner => {
    document.getElementById('corner' + corner).addEventListener('input', e => {
      state.corners[corner.toLowerCase()] = e.target.value;
      render();
    });
  });

  document.getElementById('addStopBtn').addEventListener('click', () => {
    const sorted = [...state.stops].sort((a, b) => a.pos - b.pos);
    let bestPos = 50, biggestGap = 0;
    for (let i = 0; i < sorted.length - 1; i++) {
      const gap = sorted[i + 1].pos - sorted[i].pos;
      if (gap > biggestGap) { biggestGap = gap; bestPos = Math.round((sorted[i].pos + sorted[i + 1].pos) / 2); }
    }
    state.stops.push({ color: '#888888', pos: bestPos });
    renderStops();
    render();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('cssOutput').textContent).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
  });

  document.getElementById('exportBtn').addEventListener('click', exportPNG);

  window.addEventListener('resize', render);

  renderStops();
  render();
}

init();
</script>

<div id="importfooter"></div>
</body>
</html>
