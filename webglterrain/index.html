<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js terrain + fog demo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="stylesheet" href="https://jbenedict.com/things/webglterrain/main.css" />
    <style>
      body {
        background-color: #efd1b5;
        color: #61443e;
        margin: 0;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        font-family: sans-serif;
      }
      a {
        color: #a06851;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://jbenedict.com/things/webglterrain/three.module.js",
          "three/addons/": "https://jbenedict.com/things/webglterrain/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="container"></div>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - webgl terrain + fog demo<br>
      (left click: forward, right click: backward)
    </div>

    <script type="module">
      import * as THREE from 'three';
      import Stats from 'three/addons/stats.module.js';
      import { FirstPersonControls } from 'three/addons/FirstPersonControls.js';
      import { ImprovedNoise } from 'three/addons/ImprovedNoise.js';

      let container, stats;
      let camera, controls, scene, renderer;
      let mesh, texture;

      const worldWidth = 256;
      const worldDepth = 256;
      const clock = new THREE.Clock();

      init();

      function init() {
        container = document.getElementById('container');

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(100, 800, -800);
        camera.lookAt(-100, 810, -800);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xefd1b5);
        scene.fog = new THREE.FogExp2(0xefd1b5, 0.0025);

        const data = generateHeight(worldWidth, worldDepth);

        const geometry = new THREE.PlaneGeometry(7500, 7500, worldWidth - 1, worldDepth - 1);
        geometry.rotateX(-Math.PI / 2);

        const vertices = geometry.attributes.position.array;
        for (let i = 0, j = 0, l = vertices.length; i < l; i++, j += 3) {
          vertices[j + 1] = data[i] * 10;
        }

        texture = new THREE.CanvasTexture(generateTexture(data, worldWidth, worldDepth));
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.encoding = THREE.sRGBEncoding;

        mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture }));
        scene.add(mesh);

        renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        container.appendChild(renderer.domElement);

        controls = new FirstPersonControls(camera, renderer.domElement);
        controls.movementSpeed = 150;
        controls.lookSpeed = 0.1;

        stats = new Stats();
        container.appendChild(stats.dom);

        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function generateHeight(width, height) {
        const size = width * height;
        const data = new Uint8Array(size);
        const perlin = new ImprovedNoise();
        const z = Math.random() * 100;

        let seed = Math.PI / 4;
        const random = () => {
          const x = Math.sin(seed++) * 10000;
          return x - Math.floor(x);
        };

        let quality = 1;
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < size; i++) {
            const x = i % width;
            const y = Math.floor(i / width);
            data[i] += Math.abs(perlin.noise(x / quality, y / quality, z) * quality * 1.75);
          }
          quality *= 5;
        }

        return data;
      }

      function generateTexture(data, width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');

        const image = context.createImageData(width, height);
        const imageData = image.data;
        const sun = new THREE.Vector3(1, 1, 1).normalize();
        const vector3 = new THREE.Vector3();

        for (let i = 0, j = 0, l = imageData.length; i < l; i += 4, j++) {
          const get = (k) => data[k] ?? data[j];
          vector3.x = get(j - 2) - get(j + 2);
          vector3.y = 2;
          vector3.z = get(j - width * 2) - get(j + width * 2);
          vector3.normalize();

          const shade = vector3.dot(sun);
          const d = data[j];
          const factor = 0.5 + d * 0.007;

          imageData[i] = (96 + shade * 128) * factor;
          imageData[i + 1] = (32 + shade * 96) * factor;
          imageData[i + 2] = shade * 96 * factor;
          imageData[i + 3] = 255;
        }

        context.putImageData(image, 0, 0);

        const canvasScaled = document.createElement('canvas');
        canvasScaled.width = width * 4;
        canvasScaled.height = height * 4;
        const ctxScaled = canvasScaled.getContext('2d');
        ctxScaled.scale(4, 4);
        ctxScaled.drawImage(canvas, 0, 0);

        const imageScaled = ctxScaled.getImageData(0, 0, canvasScaled.width, canvasScaled.height);
        const dataScaled = imageScaled.data;

        for (let i = 0, l = dataScaled.length; i < l; i += 4) {
          const v = Math.floor(Math.random() * 5);
          dataScaled[i] += v;
          dataScaled[i + 1] += v;
          dataScaled[i + 2] += v;
        }

        ctxScaled.putImageData(imageScaled, 0, 0);
        return canvasScaled;
      }

      function animate() {
        render();
        stats.update();
      }

      function render() {
        controls.update(clock.getDelta());
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
