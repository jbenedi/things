<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Cover Maker</title>
<script src="https://jbenedict.com/assets/js/jquery.js"></script>
<script src="https://jbenedict.com/assets/js/main.js" type="text/javascript" defer></script>
<link rel="stylesheet" media="screen" href="https://jbenedict.com/assets/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #a30b00;
    --accent-dim: #8a0900;
    --radius: 6px;
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: 115px;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }

  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 115px - 53px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 20px 90px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: 100%;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .drop-zone {
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(163,11,0,0.04); }
  .drop-zone input { display: none; }
  .drop-zone .icon { font-size: 24px; color: var(--text3); margin-bottom: 8px; display: block; }
  .drop-zone p { color: var(--text2); font-size: 12px; line-height: 1.5; }
  .drop-zone p strong { color: var(--text); font-weight: 400; }

  .text-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 8px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: var(--border2); }

  .range-group { display: flex; flex-direction: column; gap: 6px; }
  .range-header { display: flex; justify-content: space-between; align-items: center; }
  .range-header label { font-size: 12px; color: var(--text2); }
  .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--accent); min-width: 36px; text-align: right; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px;
    background: var(--border2); outline: none; border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer; border: none;
  }

  /* Weight grid */
  .weight-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .weight-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-size: 11px;
    padding: 6px 4px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
  }
  .weight-btn:hover { border-color: var(--border2); color: var(--text); }
  .weight-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  /* Color swatches */
  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #fff; }

  .pos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .pos-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text3);
    font-size: 16px;
    padding: 8px 0;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1;
  }
  .pos-btn:hover { border-color: var(--border2); color: var(--text); }
  .pos-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  .align-tab {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--text3);
    font-size: 12px;
    font-family: var(--font-sans);
    padding: 5px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .align-tab.active { background: var(--surface); color: var(--text); }

  input[type="color"].custom-color {
    -webkit-appearance: none; appearance: none;
    width: 32px; height: 32px;
    border: 2px solid var(--border2);
    border-radius: 5px; cursor: pointer; padding: 2px; background: var(--surface2);
    flex-shrink: 0;
  }
  input[type="color"].custom-color::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"].custom-color::-webkit-color-swatch { border: none; border-radius: 3px; }

  .export-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    margin-top: 14px;
  }
  .export-btn:hover { background: var(--accent-dim); }
  .export-btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }

  /* Canvas area */
  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #1e1e1e 1px, transparent 0);
    background-size: 24px 24px;
    padding: 32px 32px calc(70px + 32px) 32px;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text3);
  }
  .placeholder svg { opacity: 0.2; }
  .placeholder p { font-size: 13px; text-align: center; line-height: 1.6; }

  .canvas-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #mainCanvas {
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    cursor: move;
    max-width: calc(100vh - 115px - 53px - 70px - 96px);
    max-height: calc(100vh - 115px - 53px - 70px - 96px);
    display: block;
  }

  .canvas-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }

  .footer { position: fixed; bottom: 0; left: 0; }
</style>
</head>
<body>

<div id="importheader"></div>

<header>
  <h1>Playlist Cover Maker</h1>
  <span>Create Spotify playlist covers with text overlays</span>
</header>

<div class="workspace">
  <div class="sidebar">

    <div>
      <div class="section-label">Background Image</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*">
        <span class="icon">⬆</span>
        <p><strong>Drop image here</strong><br>or click to browse</p>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Text</div>
      <textarea class="text-input" id="textInput" placeholder="Playlist name…" rows="3" style="resize:vertical; line-height:1.5; font-family:var(--font-mono); font-size:12px;"></textarea>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Font Size</div>
      <div class="range-group">
        <div class="range-header">
          <label>Size</label>
          <span class="range-val" id="sizeVal">14%</span>
        </div>
        <input type="range" id="sizeRange" min="4" max="30" value="14" step="1">
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Text Position</div>
      <div class="pos-grid" id="posGrid">
        <button class="pos-btn" data-pos="tl">↖</button>
        <button class="pos-btn" data-pos="tc">↑</button>
        <button class="pos-btn" data-pos="tr">↗</button>
        <button class="pos-btn" data-pos="ml">←</button>
        <button class="pos-btn" data-pos="mc">·</button>
        <button class="pos-btn" data-pos="mr">→</button>
        <button class="pos-btn" data-pos="bl">↙</button>
        <button class="pos-btn active" data-pos="bc">↓</button>
        <button class="pos-btn" data-pos="br">↘</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Text Align</div>
      <div class="pos-grid" id="alignGrid" style="grid-template-columns: 1fr 1fr 1fr;">
        <button class="pos-btn" data-align="left">&#8676;</button>
        <button class="pos-btn active" data-align="center">&#8660;</button>
        <button class="pos-btn" data-align="right">&#8677;</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Text Color</div>
      <div class="color-swatches" id="colorSwatches"></div>
      <p style="font-size:11px; color:var(--text3); margin-top:8px; line-height:1.5;">Suggested from your image</p>
    </div>

    <div class="divider"></div>

    <button class="export-btn" id="exportBtn" disabled>Download PNG</button>

  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="4" y="4" width="56" height="56" rx="8" stroke="#888" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="6" stroke="#888" stroke-width="1.5"/>
        <path d="M4 42 L18 28 L30 40 L42 26 L60 42" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="56" font-family="sans-serif" font-size="10" fill="#555" font-weight="600">PLAYLIST</text>
      </svg>
      <p>Upload an image to get started</p>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <span class="canvas-meta" id="canvasMeta"></span>
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>
</div>

<script>
const CANVAS_SIZE = 3000;
const PREVIEW_MAX = 520;

const state = {
  image: null,
  text: '',
  fontSize: 14,
  fontWeight: 700,
  position: 'bc',
  textAlign: 'center',
  color: '#ffffff',
  suggestedColors: [],
};

// ── Color analysis ────────────────────────────────────────────────

function luminance(r, g, b) {
  const a = [r, g, b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}

function contrastRatio(l1, l2) {
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}

function getSuggestedColors(img) {
  const sCanvas = document.createElement('canvas');
  sCanvas.width = 50; sCanvas.height = 50;
  const sCtx = sCanvas.getContext('2d');
  sCtx.drawImage(img, 0, 0, 50, 50);
  const data = sCtx.getImageData(0, 0, 50, 50).data;
  let r = 0, g = 0, b = 0;
  const count = data.length / 4;
  for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; }
  const imgLum = luminance(r/count, g/count, b/count);

  const candidates = [
    '#ffffff','#000000','#f5f5f5','#111111',
    '#fffde7','#fff3e0','#fce4ec','#e3f2fd','#e8f5e9',
    '#ffeb3b','#ff9800','#4caf50','#2196f3','#e91e63',
    '#b71c1c','#1a237e','#1b5e20','#4a148c','#e65100',
    '#ff5722','#607d8b','#795548','#009688','#673ab7',
  ];

  const scored = candidates.map(hex => {
    const rv = parseInt(hex.slice(1,3),16);
    const gv = parseInt(hex.slice(3,5),16);
    const bv = parseInt(hex.slice(5,7),16);
    return { hex, contrast: contrastRatio(luminance(rv,gv,bv), imgLum) };
  });
  scored.sort((a, b) => b.contrast - a.contrast);

  const seen = new Set();
  const results = [];
  for (const s of scored) {
    if (!seen.has(s.hex)) { seen.add(s.hex); results.push(s.hex); }
    if (results.length === 11) break;
  }
  while (results.length < 11) results.push('#888888');
  return results;
}

// ── Text wrapping ─────────────────────────────────────────────────

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// ── Position math ─────────────────────────────────────────────────

function getTextXAlign(pos) {
  const padding = CANVAS_SIZE * 0.08;
  const h = pos[1];
  const align = state.textAlign;

  // Anchor x from position, then shift based on textAlign
  // so text always flows inward and stays on canvas
  let x;
  if (h === 'l') {
    // left position: anchor at left edge
    // left-align: text goes right from padding ✓
    // center-align: text centered around left-third
    // right-align: text ends at left third
    if (align === 'left') x = padding;
    else if (align === 'center') x = CANVAS_SIZE * 0.25;
    else x = CANVAS_SIZE * 0.5 - padding;
  } else if (h === 'r') {
    // right position: mirror of above
    if (align === 'right') x = CANVAS_SIZE - padding;
    else if (align === 'center') x = CANVAS_SIZE * 0.75;
    else x = CANVAS_SIZE * 0.5 + padding;
  } else {
    // center position: anchor always stays at canvas center
    // textAlign shifts how text flows from that point
    x = CANVAS_SIZE / 2;
  }

  return { x, align };
}

function getBaseY(pos, totalTextH) {
  const v = pos[0];
  const padding = CANVAS_SIZE * 0.08;
  if (v === 't') return padding;
  if (v === 'm') return (CANVAS_SIZE - totalTextH) / 2;
  return CANVAS_SIZE - padding - totalTextH;
}

// ── Render ────────────────────────────────────────────────────────

function render() {
  if (!state.image) return;

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  const img = state.image;
  const scale = Math.max(CANVAS_SIZE / img.naturalWidth, CANVAS_SIZE / img.naturalHeight);
  const dw = img.naturalWidth * scale;
  const dh = img.naturalHeight * scale;
  ctx.drawImage(img, (CANVAS_SIZE - dw) / 2, (CANVAS_SIZE - dh) / 2, dw, dh);

  const text = state.text.trim();
  if (!text) { updatePreviewSize(); return; }

  const fontSize = Math.round(CANVAS_SIZE * (state.fontSize / 100));
  const padding = CANVAS_SIZE * 0.08;
  const h = state.position[1];
  const maxWidth = h !== 'c' ? CANVAS_SIZE * 0.5 - padding : CANVAS_SIZE - padding * 2;

  ctx.font = `${state.fontWeight} ${fontSize}px 'Montserrat', sans-serif`;

  // Split on manual newlines first, then wrap each segment
  const segments = text.split('\n');
  const allLines = [];
  for (const seg of segments) {
    const wrapped = seg.trim() === '' ? [''] : wrapText(ctx, seg, maxWidth);
    allLines.push(...wrapped);
  }

  const lineH = fontSize * 1.1;
  const totalTextH = allLines.length * lineH;

  const { x, align } = getTextXAlign(state.position);
  const baseY = getBaseY(state.position, totalTextH);

  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillStyle = state.color;
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = fontSize * 0.3;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = fontSize * 0.04;

  allLines.forEach((line, i) => ctx.fillText(line, x, baseY + i * lineH));

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;

  updatePreviewSize();
}

function updatePreviewSize() {
  const canvas = document.getElementById('mainCanvas');
  const displaySize = Math.min(PREVIEW_MAX, window.innerHeight - 300);
  canvas.style.width = displaySize + 'px';
  canvas.style.height = displaySize + 'px';
  document.getElementById('canvasMeta').textContent = '3000 × 3000px';
}

// ── Color swatches ────────────────────────────────────────────────

function buildSwatches(colors) {
  const wrap = document.getElementById('colorSwatches');
  wrap.innerHTML = '';
  const lightHexes = new Set(['#ffffff','#f5f5f5','#fffde7','#fff3e0','#fce4ec','#e3f2fd','#e8f5e9','#ffeb3b']);

  colors.forEach(hex => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (hex === state.color ? ' active' : '');
    s.style.background = hex;
    s.dataset.color = hex;
    s.style.border = lightHexes.has(hex) ? '2px solid #333' : '2px solid transparent';
    s.addEventListener('click', () => {
      state.color = hex;
      document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
      s.classList.add('active');
      render();
    });
    wrap.appendChild(s);
  });

  // Custom color picker as 12th slot — palette icon
  const customWrap = document.createElement('div');
  customWrap.style.cssText = 'position:relative;width:32px;height:32px;flex-shrink:0;';

  const customLabel = document.createElement('label');
  customLabel.style.cssText = 'width:32px;height:32px;border-radius:5px;border:2px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:border-color 0.15s;';
  customLabel.title = 'Custom color';
  customLabel.textContent = '🎨';

  const custom = document.createElement('input');
  custom.type = 'color';
  custom.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
  custom.value = state.color;
  custom.addEventListener('input', e => {
    state.color = e.target.value;
    customLabel.style.background = e.target.value;
    customLabel.textContent = '';
    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
    render();
  });

  customLabel.addEventListener('click', () => custom.click());
  customWrap.appendChild(custom);
  customWrap.appendChild(customLabel);
  wrap.appendChild(customWrap);
}

// ── Init ──────────────────────────────────────────────────────────

function init() {
  const dz = document.getElementById('dropZone');
  dz.addEventListener('click', () => document.getElementById('fileInput').click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) { loadFile(item.getAsFile()); break; }
    }
  });

  document.getElementById('textInput').addEventListener('input', e => { state.text = e.target.value; render(); });

  document.getElementById('sizeRange').addEventListener('input', e => {
    state.fontSize = parseInt(e.target.value);
    document.getElementById('sizeVal').textContent = state.fontSize + '%';
    render();
  });

  document.querySelectorAll('#alignGrid .pos-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#alignGrid .pos-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.textAlign = btn.dataset.align;
      render();
    });
  });

  document.querySelectorAll('#posGrid .pos-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#posGrid .pos-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.position = btn.dataset.pos;
      render();
    });
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const canvas = document.getElementById('mainCanvas');
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (state.text || 'playlist-cover') + '.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });

  buildSwatches(['#ffffff','#000000','#f5f5f5','#111111','#ffeb3b','#ff9800','#4caf50','#2196f3','#e91e63','#b71c1c','#607d8b']);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('canvasWrap').style.display = 'flex';
      document.getElementById('exportBtn').disabled = false;
      const colors = getSuggestedColors(img);
      state.suggestedColors = colors;
      state.color = colors[0] || '#ffffff';
      buildSwatches(colors);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

init();
</script>

<div id="importfooter"></div>
</body>
