<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Generator</title>
<script src="https://jbenedict.com/assets/js/jquery.js"></script>
<script src="https://jbenedict.com/assets/js/main.js" type="text/javascript" defer></script>
<link rel="stylesheet" media="screen" href="https://jbenedict.com/assets/css/main.css">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #a30b00;
    --accent-dim: #8a0900;
    --radius: 6px;
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-top: 115px;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }

  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 115px - 53px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 20px 90px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: 100%;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  .text-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: var(--border2); }
  .text-input.error { border-color: var(--accent); }

  .format-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .format-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .format-btn:hover { border-color: var(--border2); color: var(--text); }
  .format-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }

  .format-desc {
    font-size: 10px;
    color: var(--text3);
    font-family: var(--font-mono);
  }
  .format-btn.active .format-desc { color: rgba(163,11,0,0.6); }

  .range-group { display: flex; flex-direction: column; gap: 6px; }
  .range-header { display: flex; justify-content: space-between; align-items: center; }
  .range-header label { font-size: 12px; color: var(--text2); }
  .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--accent); min-width: 36px; text-align: right; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px;
    background: var(--border2); outline: none; border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--accent); border-radius: 50%; cursor: pointer; border: none;
  }

  .fit-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 3px;
  }
  .fit-tab {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--text3);
    font-size: 12px;
    font-family: var(--font-sans);
    padding: 5px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .fit-tab.active { background: var(--surface); color: var(--text); }

  .export-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    margin-top: 14px;
  }
  .export-btn:hover { background: var(--accent-dim); }
  .export-btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }

  /* Canvas area */
  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #1e1e1e 1px, transparent 0);
    background-size: 24px 24px;
    padding: 32px 32px calc(70px + 32px) 32px;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text3);
  }
  .placeholder svg { opacity: 0.2; }
  .placeholder p { font-size: 13px; text-align: center; line-height: 1.6; }

  .barcode-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .barcode-card {
    background: #ffffff;
    border-radius: 8px;
    padding: 24px 32px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #barcodeCanvas {
    display: block;
    max-width: calc(100vw - 280px - 128px);
    max-height: calc(100vh - 115px - 53px - 70px - 160px);
  }

  .error-msg {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    text-align: center;
  }

  .footer { position: fixed; bottom: 0; left: 0; }
</style>
</head>
<body>

<div id="importheader"></div>

<header>
  <h1>Barcode Generator</h1>
  <span>Generate barcodes in common formats</span>
</header>

<div class="workspace">
  <div class="sidebar">

    <div>
      <div class="section-label">Value</div>
      <input type="text" class="text-input" id="valueInput" placeholder="Enter barcode value…" value="123456789012">
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Format</div>
      <div class="format-list">
        <button class="format-btn active" data-fmt="CODE128">
          <span>Code 128</span><span class="format-desc">any text</span>
        </button>
        <button class="format-btn" data-fmt="CODE39">
          <span>Code 39</span><span class="format-desc">alphanumeric</span>
        </button>
        <button class="format-btn" data-fmt="EAN13">
          <span>EAN-13</span><span class="format-desc">13 digits</span>
        </button>
        <button class="format-btn" data-fmt="EAN8">
          <span>EAN-8</span><span class="format-desc">8 digits</span>
        </button>
        <button class="format-btn" data-fmt="UPC">
          <span>UPC-A</span><span class="format-desc">12 digits</span>
        </button>
        <button class="format-btn" data-fmt="ITF14">
          <span>ITF-14</span><span class="format-desc">14 digits</span>
        </button>
        <button class="format-btn" data-fmt="MSI">
          <span>MSI</span><span class="format-desc">numeric</span>
        </button>
        <button class="format-btn" data-fmt="pharmacode">
          <span>Pharmacode</span><span class="format-desc">3–131070</span>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Options</div>

      <div class="range-group" style="margin-bottom:12px;">
        <div class="range-header">
          <label>Width</label>
          <span class="range-val" id="widthVal">2px</span>
        </div>
        <input type="range" id="widthRange" min="1" max="5" value="2" step="0.5">
      </div>

      <div class="range-group" style="margin-bottom:12px;">
        <div class="range-header">
          <label>Height</label>
          <span class="range-val" id="heightVal">80px</span>
        </div>
        <input type="range" id="heightRange" min="20" max="200" value="80" step="4">
      </div>

      <div style="margin-bottom:10px;">
        <div class="section-label">Label</div>
        <div class="fit-tabs">
          <button class="fit-tab active" data-label="true">Show</button>
          <button class="fit-tab" data-label="false">Hide</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <button class="export-btn" id="exportBtn" disabled>Download PNG</button>

  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="12" width="4" height="40" fill="#555"/>
        <rect x="11" y="12" width="2" height="40" fill="#555"/>
        <rect x="16" y="12" width="6" height="40" fill="#555"/>
        <rect x="25" y="12" width="3" height="40" fill="#555"/>
        <rect x="31" y="12" width="5" height="40" fill="#555"/>
        <rect x="39" y="12" width="2" height="40" fill="#555"/>
        <rect x="44" y="12" width="6" height="40" fill="#555"/>
        <rect x="53" y="12" width="3" height="40" fill="#555"/>
        <rect x="59" y="12" width="4" height="40" fill="#555"/>
      </svg>
      <p>Enter a value to generate a barcode</p>
    </div>
    <div class="barcode-wrap" id="barcodeWrap" style="display:none;">
      <div class="barcode-card">
        <canvas id="barcodeCanvas"></canvas>
      </div>
      <span class="error-msg" id="errorMsg" style="display:none;"></span>
    </div>
  </div>
</div>

<script>
const state = {
  value: '123456789012',
  format: 'CODE128',
  barWidth: 2,
  barHeight: 80,
  showLabel: true,
};

function render() {
  const canvas = document.getElementById('barcodeCanvas');
  const errorMsg = document.getElementById('errorMsg');

  try {
    JsBarcode(canvas, state.value, {
      format: state.format,
      width: state.barWidth,
      height: state.barHeight,
      displayValue: state.showLabel,
      background: '#ffffff',
      lineColor: '#000000',
      margin: 24,
      font: 'monospace',
      fontSize: 14,
    });

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('barcodeWrap').style.display = 'flex';
    document.getElementById('exportBtn').disabled = false;
    errorMsg.style.display = 'none';
    document.getElementById('valueInput').classList.remove('error');

  } catch (e) {
    errorMsg.textContent = 'Invalid value for ' + state.format + ' format';
    errorMsg.style.display = 'block';
    document.getElementById('valueInput').classList.add('error');
    document.getElementById('exportBtn').disabled = true;
  }
}

function init() {
  // Auto-render on load
  render();

  document.getElementById('valueInput').addEventListener('input', e => {
    state.value = e.target.value;
    if (state.value) render();
  });

  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.format = btn.dataset.fmt;
      render();
    });
  });

  document.getElementById('widthRange').addEventListener('input', e => {
    state.barWidth = parseFloat(e.target.value);
    document.getElementById('widthVal').textContent = state.barWidth + 'px';
    render();
  });

  document.getElementById('heightRange').addEventListener('input', e => {
    state.barHeight = parseInt(e.target.value);
    document.getElementById('heightVal').textContent = state.barHeight + 'px';
    render();
  });

  document.querySelectorAll('.fit-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fit-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.showLabel = btn.dataset.label === 'true';
      render();
    });
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const canvas = document.getElementById('barcodeCanvas');
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `barcode-${state.format}-${state.value}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });
}

init();
</script>

<div id="importfooter"></div>
</body>
</html>
