<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Converter</title>
<script src="https://jbenedict.com/assets/js/jquery.js"></script>
<script src="https://jbenedict.com/assets/js/main.js" type="text/javascript" defer></script>
<link rel="stylesheet" media="screen" href="https://jbenedict.com/assets/css/main.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e; --surface: #161616; --surface2: #1f1f1f;
    --border: #2a2a2a; --border2: #333;
    --text: #e8e8e8; --text2: #888; --text3: #555;
    --accent: #a30b00; --accent-dim: #8a0900;
    --radius: 6px;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; padding-top: 115px; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }
  .workspace { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 115px - 53px); }
  .sidebar { border-right: 1px solid var(--border); padding: 20px 20px 90px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; max-height: 100%; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
  .divider { height: 1px; background: var(--border); margin: 2px 0; }
  .drop-zone { border: 1px dashed var(--border2); border-radius: var(--radius); padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: var(--surface); }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(163,11,0,0.04); }
  .drop-zone input { display: none; }
  .drop-zone .icon { font-size: 24px; color: var(--text3); margin-bottom: 8px; display: block; }
  .drop-zone p { color: var(--text2); font-size: 12px; line-height: 1.5; }
  .drop-zone p strong { color: var(--text); font-weight: 400; }
  .format-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .format-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); font-family: var(--font-mono); font-size: 12px; padding: 9px 6px; cursor: pointer; transition: all 0.15s; text-align: center; }
  .format-btn:hover { border-color: var(--border2); color: var(--text); }
  .format-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(163,11,0,0.06); }
  .range-group { display: flex; flex-direction: column; gap: 6px; }
  .range-header { display: flex; justify-content: space-between; align-items: center; }
  .range-header label { font-size: 12px; color: var(--text2); }
  .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--accent); min-width: 36px; text-align: right; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: var(--border2); outline: none; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; border: none; }
  .dim-row { display: flex; align-items: center; gap: 6px; }
  .dim-input-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .dim-input-wrap label { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-align: center; }
  .dim-input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 6px 4px; width: 100%; outline: none; text-align: center; transition: border-color 0.2s; }
  .dim-input:focus { border-color: var(--border2); }
  .lock-btn { background: var(--surface2); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--accent); background: rgba(163,11,0,0.06); font-size: 13px; padding: 6px 8px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; margin-top: 14px; }
  .lock-btn.unlocked { border-color: var(--border); color: var(--text3); background: var(--surface2); opacity: 0.5; }
  .reset-btn { background: none; border: none; color: var(--text3); font-size: 11px; font-family: var(--font-sans); cursor: pointer; padding: 0; transition: color 0.15s; text-align: right; width: 100%; margin-top: 4px; }
  .reset-btn:hover { color: var(--accent); }
  .info-block { display: flex; flex-direction: column; gap: 6px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text2); }
  .info-val { font-family: var(--font-mono); font-size: 12px; color: var(--text); }
  .export-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: var(--font-sans); font-size: 13px; font-weight: 500; padding: 10px 16px; cursor: pointer; width: 100%; transition: background 0.15s; margin-top: 14px; }
  .export-btn:hover { background: var(--accent-dim); }
  .export-btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }
  .canvas-area { display: flex; align-items: center; justify-content: center; background: var(--bg); background-image: radial-gradient(circle at 1px 1px, #1e1e1e 1px, transparent 0); background-size: 24px 24px; padding: 32px 32px calc(70px + 32px) 32px; overflow: hidden; min-width: 0; min-height: 0; }
  .placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text3); }
  .placeholder svg { opacity: 0.2; }
  .placeholder p { font-size: 13px; text-align: center; line-height: 1.6; }
  .canvas-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #mainCanvas { border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); display: block; }
  .canvas-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .footer { position: fixed; bottom: 0; left: 0; }
</style>
</head>
<body>
<div id="importheader"></div>
<header>
  <h1>Image Converter</h1>
  <span>Convert and resize images to PNG, JPG, or WebP</span>
</header>
<div class="workspace">
  <div class="sidebar">

    <div>
      <div class="section-label">Image</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*">
        <span class="icon">⬆</span>
        <p><strong>Drop image here</strong><br>or click to browse</p>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Convert To</div>
      <div class="format-grid">
        <button class="format-btn active" data-fmt="png">PNG</button>
        <button class="format-btn" data-fmt="jpg">JPG</button>
        <button class="format-btn" data-fmt="webp">WebP</button>
      </div>
    </div>

    <div class="divider"></div>

    <div id="qualitySection" style="display:none;">
      <div class="section-label">Quality</div>
      <div class="range-group">
        <div class="range-header">
          <label>Amount</label>
          <span class="range-val" id="qualityVal">90%</span>
        </div>
        <input type="range" id="qualityRange" min="10" max="100" value="90" step="5">
      </div>
    </div>

    <div>
      <div class="section-label">Dimensions</div>
      <div class="dim-row">
        <div class="dim-input-wrap">
          <input type="number" class="dim-input" id="dimW" min="1" placeholder="W">
          <label>W</label>
        </div>
        <button class="lock-btn" id="lockBtn">⛓</button>
        <div class="dim-input-wrap">
          <input type="number" class="dim-input" id="dimH" min="1" placeholder="H">
          <label>H</label>
        </div>
      </div>
      <button class="reset-btn" id="resetDimBtn">Reset to original</button>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Info</div>
      <div class="info-block">
        <div class="info-row"><span>Original</span><span class="info-val" id="infoOriginal">—</span></div>
        <div class="info-row"><span>Format</span><span class="info-val" id="infoFormat">—</span></div>
        <div class="info-row"><span>Output size</span><span class="info-val" id="infoDimensions">—</span></div>
        <div class="info-row"><span>Est. file size</span><span class="info-val" id="infoSize">—</span></div>
      </div>
      <button class="export-btn" id="exportBtn" disabled>Download</button>
    </div>

  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="52" height="52" rx="4" stroke="#888" stroke-width="1.5"/>
        <path d="M6 42 L18 28 L28 38 L38 22 L58 42" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="20" r="5" stroke="#888" stroke-width="1.5"/>
        <path d="M36 46 L42 40 L48 46" stroke="#a30b00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="42" y1="40" x2="42" y2="52" stroke="#a30b00" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p>Upload an image to convert or resize</p>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <span class="canvas-meta" id="canvasMeta"></span>
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>
</div>

<script>
const MIME = { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp' };
const EXT  = { png: 'png', jpg: 'jpg', webp: 'webp' };

const state = {
  image: null,
  originalName: 'image',
  originalType: '',
  format: 'png',
  quality: 0.9,
  outW: 0,
  outH: 0,
  locked: true,
};

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(2) + ' MB';
}

function render() {
  if (!state.image) return;

  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  const w = state.outW;
  const h = state.outH;

  canvas.width = w;
  canvas.height = h;

  if (state.format === 'jpg') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
  } else {
    ctx.clearRect(0, 0, w, h);
  }

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(state.image, 0, 0, w, h);

  // Scale for display
  const area = document.getElementById('canvasArea');
  const maxW = area.clientWidth - 64;
  const maxH = area.clientHeight - 96;
  const scale = Math.min(1, maxW / w, maxH / h);
  canvas.style.width  = Math.round(w * scale) + 'px';
  canvas.style.height = Math.round(h * scale) + 'px';

  document.getElementById('canvasMeta').textContent = w + ' × ' + h + 'px';
  document.getElementById('infoDimensions').textContent = w + ' × ' + h;

  const q = state.format === 'png' ? undefined : state.quality;
  canvas.toBlob(blob => {
    if (blob) document.getElementById('infoSize').textContent = formatBytes(blob.size);
  }, MIME[state.format], q);
}

function setDims(w, h) {
  state.outW = w;
  state.outH = h;
  document.getElementById('dimW').value = w;
  document.getElementById('dimH').value = h;
}

function init() {
  // Drop zone
  const dz = document.getElementById('dropZone');
  dz.addEventListener('click', () => document.getElementById('fileInput').click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) { loadFile(item.getAsFile()); break; }
    }
  });

  // Format
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.format = btn.dataset.fmt;
      document.getElementById('qualitySection').style.display = state.format !== 'png' ? 'block' : 'none';
      document.getElementById('infoFormat').textContent =
        (state.originalType.split('/')[1] || '?').toUpperCase() + ' → ' + state.format.toUpperCase();
      render();
    });
  });

  // Quality
  document.getElementById('qualityRange').addEventListener('input', e => {
    state.quality = parseInt(e.target.value) / 100;
    document.getElementById('qualityVal').textContent = e.target.value + '%';
    render();
  });

  // Lock
  const lockBtn = document.getElementById('lockBtn');
  lockBtn.addEventListener('click', () => {
    state.locked = !state.locked;
    lockBtn.classList.toggle('unlocked', !state.locked);
  });

  // Dimensions — use 'change' so render only fires on blur/enter
  document.getElementById('dimW').addEventListener('change', e => {
    const w = Math.max(1, parseInt(e.target.value) || 1);
    state.outW = w;
    if (state.locked && state.image) {
      state.outH = Math.round(w * state.image.naturalHeight / state.image.naturalWidth);
      document.getElementById('dimH').value = state.outH;
    }
    render();
  });

  document.getElementById('dimH').addEventListener('change', e => {
    const h = Math.max(1, parseInt(e.target.value) || 1);
    state.outH = h;
    if (state.locked && state.image) {
      state.outW = Math.round(h * state.image.naturalWidth / state.image.naturalHeight);
      document.getElementById('dimW').value = state.outW;
    }
    render();
  });

  document.getElementById('resetDimBtn').addEventListener('click', () => {
    if (!state.image) return;
    setDims(state.image.naturalWidth, state.image.naturalHeight);
    render();
  });

  // Export
  document.getElementById('exportBtn').addEventListener('click', () => {
    if (!state.image) return;
    const canvas = document.getElementById('mainCanvas');
    const q = state.format === 'png' ? undefined : state.quality;
    const base = state.originalName.replace(/\.[^/.]+$/, '');
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = base + '.' + EXT[state.format];
      a.click();
      URL.revokeObjectURL(url);
    }, MIME[state.format], q);
  });
}

function loadFile(file) {
  state.originalName = file.name || 'image';
  state.originalType = file.type;

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      setDims(img.naturalWidth, img.naturalHeight);

      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('canvasWrap').style.display = 'flex';
      document.getElementById('exportBtn').disabled = false;
      document.getElementById('infoOriginal').textContent =
        formatBytes(file.size) + ' · ' + (file.type.split('/')[1] || '?').toUpperCase();
      document.getElementById('infoFormat').textContent =
        (file.type.split('/')[1] || '?').toUpperCase() + ' → ' + state.format.toUpperCase();

      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

init();
</script>

<div id="importfooter"></div>
</body>
</html>
